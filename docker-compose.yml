services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spa_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-spa_platform}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - spa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spa} -d ${POSTGRES_DB:-spa_platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  spa-postgres-data: