name: Keep Backend Alive

on:
  schedule:
    # Run every 10 minutes between 05:00 UTC and 23:59 UTC
    # (Corresponds to 06:00 AM to 00:59 AM in UTC+1 / Tunisia time)
    - cron: '*/10 5-23 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Render Healthz
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping API Endpoint
        run: |
          echo "Pinging Render backend (Active hours: 06:00 - 00:00)..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://spa-complexe-rouis.onrender.com/api/healthz)
          echo "Health check HTTP status: $STATUS"
          if [ "$STATUS" -eq 200 ]; then
            echo "API is healthy and awake!"
          else
            echo "Warning: Received status $STATUS"
          fi
